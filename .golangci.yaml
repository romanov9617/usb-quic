version: "2"

linters:
  default: all

  disable:
    - interfacebloat
    - wsl
    - tagliatelle

  enable:
    - wsl_v5

  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/spf13/cobra
            - go.uber.org/fx
            - usb-quic/internal/adapter/delivery/cli
            - usb-quic/internal/app

    varnamelen:
      ignore-names:
        - id
        - ip
        - db
        - wg
        - ok
        - tx
        - nc
        - tt

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - containedctx
          - funlen
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - paralleltest
          - tparallel
          - testpackage
          - thelper
          - gochecknoglobals
          - wrapcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
