name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read


jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout=5m

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build Binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty)"
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          for bin in usb-quic daemon; do
            go build \
              -trimpath \
              -ldflags "-s -w -X usb-quic/internal/adapter/delivery/cli.version=${VERSION} -X usb-quic/internal/adapter/delivery/daemon.version=${VERSION}" \
              -o "dist/${bin}" \
              "./cmd/${bin}"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: usb-quic-linux-amd64
          path: |
            dist/usb-quic
            dist/daemon
